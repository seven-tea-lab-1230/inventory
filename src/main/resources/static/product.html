<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <title>商品詳細</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="page">
    
    <section class="product-header">
        <h1 id="product-name"></h1>
        <p id="product-stock" class="stock-display"></p>
    </section>
    
    <section class="card">
        <h2>在庫を変更</h2>
        
        <input id="quantity" type="number" min="1" step="1" placeholder="数量">
        
        <div class="stock-buttons">
            <button id="add-button" class="primary-button">入庫</button>
            <button id="remove-button">出庫</button>
        </div>
        
        <p id="message"></p>
    </section>
    
    
    <section class="card">
        <h2>商品情報を編集</h2>
        
        <input id="edit-name" type="text" placeholder="商品名">
        
        <select id="edit-category">
            <option value="TSHIRT">Tシャツ</option>
            <option value="TOWEL">タオル</option>
            <option value="STICKER">ステッカー</option>
            <option value="RUBBER_BAND">ラバーバンド</option>
            <option value="ACCESSORY">小物・雑貨</option>
            <option value="MEDIA">CD・音源</option>
            <option value="OTHER">その他</option>
        </select>
        
        <button id="edit-button">変更を保存</button>
    </section>
    
    <button id="delete-button" class="delete-button">商品を削除</button>
    
    <section class="card">
        <h2>入出庫履歴</h2>
        <div id="history-list"></div>
    </section>

</main>

<script src="/product.js"></script>
</body>
</html>
